<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1408">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Morse Code</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --pcb-bg: #1a1408;
      --pcb-dark: #0f0c05;
      --gold: #c8a84a;
      --gold-dim: #6b5a28;
      --gold-bright: #e8d070;
      --node-bg: #2a2010;
      --node-border: #c8a84a;
      --led-red: #ff2200;
      --led-green: #22ff44;
      --silkscreen: #d0c8a0;
      --trace: #907830;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --pcb-bg: #1a1408;
        --pcb-dark: #0f0c05;
      }
    }
    :root[data-theme="dark"] {
      --pcb-bg: #1a1408;
      --pcb-dark: #0f0c05;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }
    body {
      background: var(--pcb-bg);
      color: var(--gold);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: row;
      position: relative;
      overflow: hidden;
    }

    .panel {
      width: 240px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      border-left: 2px solid #2a2010;
    }

    .title {
      text-align: center;
      padding: 8px 0 2px;
      font-size: 20px;
      letter-spacing: 8px;
      color: var(--silkscreen);
      text-shadow: 0 0 6px rgba(200, 168, 74, 0.3);
      flex-shrink: 0;
    }

    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px;
      flex-shrink: 0;
    }
    .mode-btn {
      background: var(--pcb-dark);
      border: 1px solid var(--gold-dim);
      color: var(--gold-dim);
      font-family: inherit;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--gold-dim);
      color: var(--pcb-dark);
      border-color: var(--gold);
    }

    .tree-wrap {
      flex: 1;
      min-height: 0;
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
    }
    .tree-svg { width: 100%; height: 100%; }

    .trace-line {
      stroke: var(--trace);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .trace-line.active {
      stroke: var(--gold-bright);
      stroke-width: 3;
      filter: drop-shadow(0 0 4px rgba(200, 168, 74, 0.6));
    }
    .trace-label {
      fill: var(--silkscreen);
      font-size: 9px;
      font-family: 'Share Tech Mono', monospace;
      text-anchor: middle;
      opacity: 0.6;
    }

    .node-box {
      fill: var(--node-bg);
      stroke: var(--node-border);
      stroke-width: 1.5;
      rx: 4;
      cursor: pointer;
      transition: fill 0.2s;
    }
    .node-box.active {
      fill: #3a2808;
      stroke: var(--led-red);
      stroke-width: 2;
      filter: drop-shadow(0 0 8px rgba(255, 34, 0, 0.6));
    }
    .node-box.correct {
      fill: #0a2a08;
      stroke: var(--led-green);
      stroke-width: 2;
      filter: drop-shadow(0 0 8px rgba(34, 255, 68, 0.5));
    }
    .node-box.target {
      fill: #2a1808;
      stroke: var(--gold-bright);
      stroke-width: 2;
      animation: pulse-target 1.2s ease-in-out infinite;
    }
    @keyframes pulse-target {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(232, 208, 112, 0.4)); }
      50% { filter: drop-shadow(0 0 10px rgba(232, 208, 112, 0.8)); }
    }

    .node-letter {
      fill: var(--gold);
      font-size: 14px;
      font-family: 'Share Tech Mono', monospace;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .node-letter.active { fill: #fff; }
    .node-code {
      fill: var(--gold-dim);
      font-size: 7px;
      font-family: 'Share Tech Mono', monospace;
      text-anchor: middle;
      pointer-events: none;
    }

    .display {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .code-display {
      font-size: 24px;
      letter-spacing: 6px;
      color: var(--gold-bright);
      min-height: 32px;
      text-align: center;
    }
    .decoded-display {
      font-size: 11px;
      color: var(--silkscreen);
      min-height: 18px;
      letter-spacing: 2px;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .num-ref {
      border: 1px solid var(--gold-dim);
      border-radius: 4px;
      padding: 6px 8px;
      background: var(--pcb-dark);
    }
    .num-ref-title {
      font-size: 9px;
      color: var(--gold-dim);
      letter-spacing: 2px;
      text-align: center;
      margin-bottom: 4px;
    }
    .num-ref-title label {
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .num-ref-title input[type="checkbox"] {
      accent-color: var(--gold);
      cursor: pointer;
    }
    .num-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2px 8px;
      font-size: 11px;
    }
    .num-grid span { color: var(--gold); white-space: nowrap; }
    .num-grid .num-char { color: var(--gold-bright); }

    .key-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }
    .key-hint {
      font-size: 10px;
      color: var(--gold-dim);
      text-align: center;
    }
    .touch-key {
      width: 100%;
      height: 64px;
      background: linear-gradient(to bottom, #3a3020, #1a1408);
      border: 2px solid var(--gold-dim);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.05s;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-key:active, .touch-key.pressed {
      background: linear-gradient(to bottom, #4a4030, #2a2018);
      border-color: var(--gold);
      transform: scale(0.98);
    }
    .touch-key-label {
      color: var(--gold);
      font-size: 14px;
      pointer-events: none;
    }

    .screw {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #5a4a2a, #2a1a08);
      border: 1px solid var(--gold-dim);
    }
    .screw::after {
      content: '+';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: var(--gold-dim);
      line-height: 1;
    }
    .screw.tl { top: 6px; left: 6px; }
    .screw.tr { top: 6px; right: 6px; }
    .screw.bl { bottom: 6px; left: 6px; }
    .screw.br { bottom: 6px; right: 6px; }

    .app::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid #2a2010;
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
    }

    @media (orientation: portrait) {
      .app { flex-direction: column; }
      .panel {
        width: 100%;
        border-left: none;
        border-top: 2px solid #2a2010;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px;
        padding: 8px 16px 16px;
      }
      .title { width: 100%; }
      .mode-bar { width: 100%; }
      .display { flex: 1; min-width: 120px; }
      .key-area { flex: 1; min-width: 160px; }
    }
    @media (max-height: 400px) {
      .panel { gap: 6px; padding: 6px 12px; }
      .title { font-size: 14px; letter-spacing: 4px; }
      .touch-key { height: 48px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <div class="tree-wrap">
      <svg class="tree-svg" id="treeSvg" viewBox="0 0 820 380" preserveAspectRatio="xMidYMid meet"></svg>
    </div>

    <div class="panel">
      <div class="title">MORSE CODE</div>

      <div class="mode-bar">
        <button class="mode-btn active" data-mode="explore" title="Free play — tap the key to navigate the tree and build letters">EXPLORE</button>
        <button class="mode-btn" data-mode="encode" title="A letter is shown — tap its Morse code on the key">ENCODE</button>
        <button class="mode-btn" data-mode="decode" title="Hear a Morse sequence — tap the code back to identify the letter">DECODE</button>
      </div>

      <div class="num-ref">
        <div class="num-ref-title"><label><input type="checkbox" id="includeNums"> INCLUDE IN PRACTICE</label></div>
        <div class="num-grid">
          <span><span class="num-char">1</span> ·————</span><span><span class="num-char">6</span> —····</span>
          <span><span class="num-char">2</span> ··———</span><span><span class="num-char">7</span> ——···</span>
          <span><span class="num-char">3</span> ···——</span><span><span class="num-char">8</span> ———··</span>
          <span><span class="num-char">4</span> ····—</span><span><span class="num-char">9</span> ————·</span>
          <span><span class="num-char">5</span> ·····</span><span><span class="num-char">0</span> —————</span>
        </div>
      </div>

      <div class="display" id="display">
        <div class="code-display" id="codeDisplay"></div>
        <div class="decoded-display" id="decodedDisplay"></div>
      </div>

      <div class="key-area">
        <div class="touch-key" id="touchKey">
          <div class="touch-key-label">‹ DIT &nbsp;·&nbsp; DAH ›</div>
        </div>
        <div class="key-hint">SHORT = DIT &nbsp;•&nbsp; LONG = DAH &nbsp;—&nbsp; SPACE KEY</div>
      </div>
    </div>
  </div>

  <script>
    // --- DATA ---
    const MORSE = {
      '.':'E', '-':'T',
      '..':'I', '.-':'A', '-.':'N', '--':'M',
      '...':'S', '..-':'U', '.-.':'R', '.--':'W',
      '-..':'D', '-.-':'K', '--.':'G', '---':'O',
      '....':'H', '...-':'V', '..-.':'F',
      '.-..':'L', '.--.':'P', '.---':'J',
      '-...':'B', '-..-':'X', '-.-.':'C', '-.--':'Y',
      '--..':'Z', '--.-':'Q',
      '.----':'1', '..---':'2', '...--':'3', '....-':'4', '.....':'5',
      '-....':'6', '--...':'7', '---..':'8', '----.':'9', '-----':'0',
    };
    const LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const ALL_CHARS = LETTERS + '0123456789';
    const REVERSE = {};
    for (const [code, ch] of Object.entries(MORSE)) {
      if (ALL_CHARS.includes(ch)) REVERSE[ch] = code;
    }

    // --- AUDIO ---
    let ctx = null;
    function ensureAudio() {
      if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (ctx.state === 'suspended') ctx.resume();
    }
    function beep(ms) {
      if (!ctx) return;
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine';
      o.frequency.value = 650;
      o.connect(g);
      g.connect(ctx.destination);
      const t = ctx.currentTime;
      g.gain.setValueAtTime(0.35, t);
      g.gain.setValueAtTime(0.35, t + ms/1000 - 0.03);
      g.gain.exponentialRampToValueAtTime(0.001, t + ms/1000);
      o.start(t);
      o.stop(t + ms/1000 + 0.01);
    }
    function playSequence(code) {
      ensureAudio();
      let d = 0;
      for (const c of code) {
        const ms = c === '.' ? 120 : 360;
        setTimeout(() => beep(ms), d);
        d += ms + 140;
      }
    }

    // --- TREE ---
    const SVG_W = 820, SVG_H = 380;
    const NW = 28, NH = 22;
    const YPOS = [20, 90, 160, 240, 330];
    const svg = document.getElementById('treeSvg');

    function codeForPos(level, index) {
      let c = '', idx = index;
      for (let l = level; l > 0; l--) {
        c = (idx % 2 === 0 ? '.' : '-') + c;
        idx = Math.floor(idx / 2);
      }
      return c;
    }

    (function renderTree() {
      const allNodes = [];
      allNodes.push({ code: '', char: '●', x: SVG_W/2, y: YPOS[0], empty: false });
      for (let lv = 1; lv < 5; lv++) {
        const cnt = 1 << lv;
        const sp = (SVG_W - 20) / cnt;
        for (let i = 0; i < cnt; i++) {
          const code = codeForPos(lv, i);
          const ch = MORSE[code] || '';
          allNodes.push({
            code, char: ch,
            x: 10 + sp * (i + 0.5), y: YPOS[lv],
            empty: !ch || !LETTERS.includes(ch)
          });
        }
      }
      let h = '';
      for (const n of allNodes) {
        if (n.empty || !n.code) continue;
        const parentCode = n.code.slice(0, -1);
        const p = allNodes.find(a => a.code === parentCode);
        if (p) {
          const isDit = n.code.endsWith('.');
          h += `<line class="trace-line" data-code="${n.code}" x1="${p.x}" y1="${p.y+NH/2}" x2="${n.x}" y2="${n.y-NH/2}"/>`;
          const mx = (p.x+n.x)/2, my = (p.y+NH/2+n.y-NH/2)/2;
          h += `<text class="trace-label" x="${mx+(isDit?-6:6)}" y="${my}">${isDit?'·':'—'}</text>`;
        }
      }
      for (const n of allNodes) {
        if (n.empty) continue;
        h += `<rect class="node-box" data-code="${n.code}" x="${n.x-NW/2}" y="${n.y-NH/2}" width="${NW}" height="${NH}" rx="4"/>`;
        h += `<text class="node-letter" data-code="${n.code}" x="${n.x}" y="${n.y}">${n.char}</text>`;
        if (n.code) {
          const vis = n.code.replace(/\./g,'·').replace(/-/g,'—');
          h += `<text class="node-code" x="${n.x}" y="${n.y+NH/2+9}">${vis}</text>`;
        }
      }
      svg.innerHTML = h;
    })();

    // --- STATE ---
    let mode = 'explore';
    let input = '';
    let decoded = '';
    let target = '';
    let score = { ok: 0, n: 0 };
    let gapTimer = null;
    let pressing = false;
    let pressT = 0;
    let liveOsc = null, liveGain = null;
    // phase: 'input' = accepting key taps, 'result' = showing answer, tap to continue
    let phase = 'input';

    const codeEl = document.getElementById('codeDisplay');
    const decEl = document.getElementById('decodedDisplay');
    const keyEl = document.getElementById('touchKey');

    // --- DISPLAY ---
    function show() {
      codeEl.textContent = input.replace(/\./g,'·').replace(/-/g,'—') || ' ';
      if (mode === 'explore') {
        decEl.textContent = decoded || 'TAP THE KEY TO BEGIN';
      } else if (mode === 'encode') {
        decEl.textContent = phase === 'result'
          ? decoded
          : (target ? `TYPE: ${target}    ${score.ok}/${score.n}` : '');
      } else {
        decEl.textContent = phase === 'result'
          ? decoded
          : `LISTEN & DECODE    ${score.ok}/${score.n}`;
      }
    }

    // --- TREE HIGHLIGHTING ---
    function clearHL() {
      svg.querySelectorAll('.node-box').forEach(e => e.classList.remove('active','correct','target'));
      svg.querySelectorAll('.node-letter').forEach(e => e.classList.remove('active'));
      svg.querySelectorAll('.trace-line').forEach(e => e.classList.remove('active'));
    }
    function hlPath(code) {
      clearHL();
      if (code == null) return;
      const box = svg.querySelector(`.node-box[data-code="${code}"]`);
      const txt = svg.querySelector(`.node-letter[data-code="${code}"]`);
      if (box) box.classList.add('active');
      if (txt) txt.classList.add('active');
      for (let i = 1; i <= code.length; i++) {
        const seg = svg.querySelector(`.trace-line[data-code="${code.substring(0,i)}"]`);
        if (seg) seg.classList.add('active');
      }
    }
    function hlCorrect(code) {
      clearHL();
      const box = svg.querySelector(`.node-box[data-code="${code}"]`);
      if (box) box.classList.add('correct');
    }
    function hlTarget(ch) {
      const code = REVERSE[ch];
      if (!code) return;
      const box = svg.querySelector(`.node-box[data-code="${code}"]`);
      if (box) box.classList.add('target');
    }

    // --- CHALLENGE ---
    function nextRound() {
      const pool = document.getElementById('includeNums').checked ? ALL_CHARS : LETTERS;
      target = pool[Math.floor(Math.random() * pool.length)];
      input = '';
      decoded = '';
      phase = 'input';
      clearHL();
      if (mode === 'encode') hlTarget(target);
      if (mode === 'decode') playSequence(REVERSE[target]);
      show();
    }

    // --- COMMIT (gap timer fired) ---
    function commit() {
      if (!input) return;
      const letter = MORSE[input];

      if (mode === 'explore') {
        decoded += (letter && ALL_CHARS.includes(letter)) ? letter : '?';
        if (letter) hlCorrect(input);
        show();
        const old = input;
        setTimeout(() => { if (input === old) { input = ''; clearHL(); show(); } }, 500);
        return;
      }

      score.n++;
      const ok = letter === target;
      if (ok) score.ok++;

      if (mode === 'encode') {
        if (ok) {
          hlCorrect(input);
          decoded = `${letter} ✓    ${score.ok}/${score.n}`;
        } else {
          hlPath(input);
          decoded = `${letter||'?'} ✗ was ${target}    ${score.ok}/${score.n}`;
        }
      } else {
        if (ok) {
          hlCorrect(REVERSE[target]);
          decoded = `${letter} ✓    ${score.ok}/${score.n}`;
        } else {
          hlPath(input);
          decoded = `${letter||'?'} ✗ was ${target} (${REVERSE[target].replace(/\./g,'·').replace(/-/g,'—')})    ${score.ok}/${score.n}`;
          const correctBox = svg.querySelector(`.node-box[data-code="${REVERSE[target]}"]`);
          if (correctBox) correctBox.classList.add('correct');
        }
      }
      input = '';
      phase = 'result';
      show();
      setTimeout(() => {
        if (phase === 'result') nextRound();
      }, ok ? 800 : 1500);
    }

    // --- KEY INPUT ---
    function onSymbol(sym) {
      if (phase === 'result') {
        nextRound();
        return;
      }
      ensureAudio();
      beep(sym === '.' ? 120 : 360);
      input += sym;
      hlPath(input);
      show();
      clearTimeout(gapTimer);
      gapTimer = setTimeout(commit, 800);
    }

    function keyDown(e) {
      e.preventDefault();
      if (pressing) return;
      if (phase === 'result') { nextRound(); return; }
      ensureAudio();
      pressing = true;
      pressT = Date.now();
      keyEl.classList.add('pressed');
      liveOsc = ctx.createOscillator();
      liveGain = ctx.createGain();
      liveOsc.type = 'sine';
      liveOsc.frequency.value = 650;
      liveGain.gain.value = 0.35;
      liveOsc.connect(liveGain);
      liveGain.connect(ctx.destination);
      liveOsc.start();
    }

    function keyUp(e) {
      e.preventDefault();
      if (!pressing) return;
      pressing = false;
      keyEl.classList.remove('pressed');
      if (liveOsc) {
        liveGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.02);
        liveOsc.stop(ctx.currentTime + 0.03);
        liveOsc = null; liveGain = null;
      }
      const sym = (Date.now() - pressT) < 180 ? '.' : '-';
      input += sym;
      hlPath(input);
      show();
      clearTimeout(gapTimer);
      gapTimer = setTimeout(commit, 800);
    }

    // --- EVENTS ---
    keyEl.addEventListener('mousedown', keyDown);
    keyEl.addEventListener('mouseup', keyUp);
    keyEl.addEventListener('mouseleave', e => { if (pressing) keyUp(e); });
    keyEl.addEventListener('touchstart', keyDown, { passive: false });
    keyEl.addEventListener('touchend', keyUp, { passive: false });
    keyEl.addEventListener('touchcancel', keyUp, { passive: false });

    document.addEventListener('keydown', e => {
      if (e.repeat) return;
      if (e.code === 'Space') { keyDown(e); }
      else if (e.key === '.') { e.preventDefault(); onSymbol('.'); }
      else if (e.key === '-') { e.preventDefault(); onSymbol('-'); }
      else if (e.key === 'Backspace') {
        e.preventDefault();
        input = ''; decoded = ''; phase = 'input';
        clearTimeout(gapTimer);
        clearHL();
        if (mode === 'encode' && target) hlTarget(target);
        show();
      }
    });
    document.addEventListener('keyup', e => {
      if (e.code === 'Space') keyUp(e);
    });

    svg.addEventListener('click', e => {
      const el = e.target.closest('[data-code]');
      if (!el) return;
      const code = el.dataset.code;
      const ch = MORSE[code];
      if (ch && ALL_CHARS.includes(ch)) {
        ensureAudio();
        playSequence(code);
        hlCorrect(code);
        codeEl.textContent = code.replace(/\./g,'·').replace(/-/g,'—');
        setTimeout(() => { clearHL(); show(); }, 1200);
      }
    });

    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        input = ''; decoded = ''; target = ''; phase = 'input';
        score = { ok: 0, n: 0 };
        clearTimeout(gapTimer);
        clearHL();
        if (mode === 'encode' || mode === 'decode') nextRound();
        show();
      });
    });

    show();
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
