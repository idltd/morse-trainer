<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a1408">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Morse Code</title>
  <link rel="manifest" href="manifest.json">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --pcb-bg: #1a1408;
      --pcb-dark: #0f0c05;
      --gold: #c8a84a;
      --gold-dim: #6b5a28;
      --gold-bright: #e8d070;
      --node-bg: #2a2010;
      --node-border: #c8a84a;
      --led-red: #ff2200;
      --led-green: #22ff44;
      --silkscreen: #d0c8a0;
      --trace: #907830;
    }
    @media (prefers-color-scheme: light) {
      :root:not([data-theme="dark"]) {
        --pcb-bg: #1a1408;
        --pcb-dark: #0f0c05;
      }
    }
    :root[data-theme="dark"] {
      --pcb-bg: #1a1408;
      --pcb-dark: #0f0c05;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      touch-action: manipulation;
    }
    body {
      background: var(--pcb-bg);
      color: var(--gold);
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
    }

    .app {
      width: 100%;
      max-width: 480px;
      height: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }

    /* Title */
    .title {
      text-align: center;
      padding: 8px 0 2px;
      font-size: 20px;
      letter-spacing: 8px;
      color: var(--silkscreen);
      text-shadow: 0 0 6px rgba(200, 168, 74, 0.3);
      flex-shrink: 0;
    }

    /* Mode selector */
    .mode-bar {
      display: flex;
      justify-content: center;
      gap: 4px;
      padding: 4px 8px;
      flex-shrink: 0;
    }
    .mode-btn {
      background: var(--pcb-dark);
      border: 1px solid var(--gold-dim);
      color: var(--gold-dim);
      font-family: inherit;
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-btn.active {
      background: var(--gold-dim);
      color: var(--pcb-dark);
      border-color: var(--gold);
    }

    /* Tree area */
    .tree-wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 4px;
    }
    .tree-svg {
      width: 100%;
      height: 100%;
      max-height: 420px;
    }

    /* SVG styles */
    .trace-line {
      stroke: var(--trace);
      stroke-width: 2;
      stroke-linecap: round;
      fill: none;
    }
    .trace-line.active {
      stroke: var(--gold-bright);
      stroke-width: 3;
      filter: drop-shadow(0 0 4px rgba(200, 168, 74, 0.6));
    }
    .trace-label {
      fill: var(--silkscreen);
      font-size: 9px;
      font-family: 'Share Tech Mono', monospace;
      text-anchor: middle;
      opacity: 0.6;
    }

    .node-box {
      fill: var(--node-bg);
      stroke: var(--node-border);
      stroke-width: 1.5;
      rx: 4;
      cursor: pointer;
      transition: fill 0.2s;
    }
    .node-box.empty {
      fill: var(--pcb-bg);
      stroke: var(--gold-dim);
      stroke-width: 0.5;
      stroke-dasharray: 2 2;
    }
    .node-box.active {
      fill: #3a2808;
      stroke: var(--led-red);
      stroke-width: 2;
      filter: drop-shadow(0 0 8px rgba(255, 34, 0, 0.6));
    }
    .node-box.correct {
      fill: #0a2a08;
      stroke: var(--led-green);
      stroke-width: 2;
      filter: drop-shadow(0 0 8px rgba(34, 255, 68, 0.5));
    }
    .node-box.target {
      fill: #2a1808;
      stroke: var(--gold-bright);
      stroke-width: 2;
      animation: pulse-target 1.2s ease-in-out infinite;
    }
    @keyframes pulse-target {
      0%, 100% { filter: drop-shadow(0 0 4px rgba(232, 208, 112, 0.4)); }
      50% { filter: drop-shadow(0 0 10px rgba(232, 208, 112, 0.8)); }
    }

    .node-letter {
      fill: var(--gold);
      font-size: 14px;
      font-family: 'Share Tech Mono', monospace;
      text-anchor: middle;
      dominant-baseline: central;
      pointer-events: none;
    }
    .node-letter.empty {
      fill: var(--gold-dim);
      font-size: 10px;
    }
    .node-letter.active {
      fill: #fff;
    }
    .node-code {
      fill: var(--gold-dim);
      font-size: 7px;
      font-family: 'Share Tech Mono', monospace;
      text-anchor: middle;
      pointer-events: none;
    }

    /* LED indicators */
    .led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #300;
      display: inline-block;
    }
    .led.on {
      background: var(--led-red);
      box-shadow: 0 0 6px var(--led-red), 0 0 12px rgba(255, 34, 0, 0.4);
    }
    .led.green {
      background: #030;
    }
    .led.green.on {
      background: var(--led-green);
      box-shadow: 0 0 6px var(--led-green);
    }

    /* Display area */
    .display {
      flex-shrink: 0;
      padding: 6px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }
    .code-display {
      font-size: 28px;
      letter-spacing: 8px;
      color: var(--gold-bright);
      min-height: 36px;
      text-align: center;
    }
    .decoded-display {
      font-size: 14px;
      color: var(--silkscreen);
      min-height: 20px;
      letter-spacing: 4px;
      text-align: center;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .prompt-display {
      font-size: 18px;
      color: var(--gold-bright);
      min-height: 24px;
      text-align: center;
    }
    .score-display {
      font-size: 12px;
      color: var(--gold-dim);
    }

    /* Key area */
    .key-area {
      flex-shrink: 0;
      padding: 8px 16px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .key-hint {
      font-size: 10px;
      color: var(--gold-dim);
      text-align: center;
    }
    .telegraph-key {
      width: 200px;
      height: 56px;
      position: relative;
      cursor: pointer;
    }
    .key-base {
      position: absolute;
      bottom: 0;
      left: 20px;
      right: 20px;
      height: 16px;
      background: linear-gradient(to bottom, #4a3a1a, #2a1a08);
      border-radius: 3px;
      border: 1px solid var(--gold-dim);
    }
    .key-arm {
      position: absolute;
      bottom: 14px;
      left: 10px;
      right: 50px;
      height: 6px;
      background: linear-gradient(to bottom, #b89838, #8a7028);
      border-radius: 2px;
      transform-origin: right center;
      transition: transform 0.05s;
    }
    .key-knob {
      position: absolute;
      bottom: 12px;
      left: 0;
      width: 40px;
      height: 24px;
      background: linear-gradient(to bottom, #2a2a2a, #1a1a1a);
      border: 1px solid #444;
      border-radius: 6px 6px 4px 4px;
      transition: transform 0.05s;
    }
    .key-pivot {
      position: absolute;
      bottom: 10px;
      right: 40px;
      width: 12px;
      height: 20px;
      background: linear-gradient(to right, #5a4a2a, #3a2a1a);
      border-radius: 2px;
      border: 1px solid var(--gold-dim);
    }
    .telegraph-key.pressed .key-arm {
      transform: rotate(2deg);
    }
    .telegraph-key.pressed .key-knob {
      transform: translateY(3px);
    }

    /* Touch key (simpler, bigger target) */
    .touch-key {
      width: 90%;
      max-width: 320px;
      height: 64px;
      background: linear-gradient(to bottom, #3a3020, #1a1408);
      border: 2px solid var(--gold-dim);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      cursor: pointer;
      transition: all 0.05s;
      -webkit-tap-highlight-color: transparent;
    }
    .touch-key:active, .touch-key.pressed {
      background: linear-gradient(to bottom, #4a4030, #2a2018);
      border-color: var(--gold);
      transform: scale(0.98);
    }
    .touch-key-label {
      color: var(--gold);
      font-size: 14px;
      pointer-events: none;
    }
    .touch-key-dots {
      display: flex;
      gap: 6px;
      pointer-events: none;
    }
    .touch-key-dots .led {
      width: 10px;
      height: 10px;
    }

    /* Screw holes */
    .screw {
      position: absolute;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 40%, #5a4a2a, #2a1a08);
      border: 1px solid var(--gold-dim);
    }
    .screw::after {
      content: '+';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 10px;
      color: var(--gold-dim);
      line-height: 1;
    }
    .screw.tl { top: 6px; left: 6px; }
    .screw.tr { top: 6px; right: 6px; }
    .screw.bl { bottom: 6px; left: 6px; }
    .screw.br { bottom: 6px; right: 6px; }

    /* PCB edge styling */
    .app::before {
      content: '';
      position: absolute;
      inset: 0;
      border: 2px solid #2a2010;
      border-radius: 8px;
      pointer-events: none;
      z-index: 10;
    }

    @media (max-height: 600px) {
      .title { padding: 4px 0 0; font-size: 16px; }
      .mode-bar { padding: 2px 8px; }
      .display { padding: 4px 16px; }
      .key-area { padding: 4px 16px 12px; }
      .touch-key { height: 50px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <div class="screw tl"></div>
    <div class="screw tr"></div>
    <div class="screw bl"></div>
    <div class="screw br"></div>

    <div class="title">MORSE CODE</div>

    <div class="mode-bar">
      <button class="mode-btn active" data-mode="explore">EXPLORE</button>
      <button class="mode-btn" data-mode="encode">ENCODE</button>
      <button class="mode-btn" data-mode="decode">DECODE</button>
    </div>

    <div class="tree-wrap">
      <svg class="tree-svg" id="treeSvg" viewBox="0 0 820 380" preserveAspectRatio="xMidYMid meet">
        <!-- Rendered by JS -->
      </svg>
    </div>

    <div class="display" id="display">
      <div class="code-display" id="codeDisplay"></div>
      <div class="decoded-display" id="decodedDisplay"></div>
    </div>

    <div class="key-area">
      <div class="touch-key" id="touchKey">
        <div class="touch-key-label">‹ DIT &nbsp;·&nbsp; DAH ›</div>
      </div>
      <div class="key-hint">SHORT TAP = DIT &nbsp;•&nbsp; LONG PRESS = DAH &nbsp;—&nbsp; SPACE = KEYBOARD</div>
    </div>
  </div>

  <script>
    // Morse code tree data
    const MORSE_MAP = {
      '.': 'E', '-': 'T',
      '..': 'I', '.-': 'A', '-.': 'N', '--': 'M',
      '...': 'S', '..-': 'U', '.-.': 'R', '.--': 'W',
      '-..': 'D', '-.-': 'K', '--.': 'G', '---': 'O',
      '....': 'H', '...-': 'V', '..-.': 'F', '..--': 'Ü',
      '.-..': 'L', '.-.-': 'Ä', '.--.': 'P', '.---': 'J',
      '-...': 'B', '-..-': 'X', '-.-.': 'C', '-.--': 'Y',
      '--..': 'Z', '--.-': 'Q', '---.': 'Ö', '----': 'CH',
    };

    const ENGLISH_LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const REVERSE_MAP = {};
    for (const [code, char] of Object.entries(MORSE_MAP)) {
      if (ENGLISH_LETTERS.includes(char)) REVERSE_MAP[char] = code;
    }

    // Tree layout
    const LEVELS = 5;
    const SVG_W = 820, SVG_H = 380;
    const NODE_W = 28, NODE_H = 22;
    const Y_POSITIONS = [20, 90, 160, 240, 330];

    function buildTree() {
      const nodes = [];
      const edges = [];

      // Root node
      nodes.push({ code: '', char: '●', x: SVG_W / 2, y: Y_POSITIONS[0], level: 0, isEmpty: false });

      for (let level = 1; level < LEVELS; level++) {
        const count = Math.pow(2, level);
        const spacing = (SVG_W - 20) / count;
        for (let i = 0; i < count; i++) {
          const code = buildCode(level, i);
          const char = MORSE_MAP[code] || '';
          const x = 10 + spacing * (i + 0.5);
          const y = Y_POSITIONS[level];
          const isEmpty = !char || !ENGLISH_LETTERS.includes(char);
          nodes.push({ code, char: char || '', x, y, level, isEmpty: !char });

          // Edge to parent
          const parentIdx = Math.floor(i / 2);
          const parentLevel = level - 1;
          const parentCount = Math.pow(2, parentLevel);
          const parentSpacing = (SVG_W - 20) / parentCount;
          const px = parentLevel === 0 ? SVG_W / 2 : 10 + parentSpacing * (parentIdx + 0.5);
          const py = Y_POSITIONS[parentLevel];
          const isDit = i % 2 === 0;
          edges.push({ x1: px, y1: py, x2: x, y2: y, isDit, code });
        }
      }
      return { nodes, edges };
    }

    function buildCode(level, index) {
      let code = '';
      let idx = index;
      for (let l = level; l > 0; l--) {
        code = (idx % 2 === 0 ? '.' : '-') + code;
        idx = Math.floor(idx / 2);
      }
      return code;
    }

    // Render tree
    const svg = document.getElementById('treeSvg');
    const { nodes, edges } = buildTree();

    function renderTree() {
      let html = '';
      // Draw edges
      for (const edge of edges) {
        html += `<line class="trace-line" data-code="${edge.code}"
          x1="${edge.x1}" y1="${edge.y1 + NODE_H/2}"
          x2="${edge.x2}" y2="${edge.y2 - NODE_H/2}" />`;
        // Label
        const mx = (edge.x1 + edge.x2) / 2;
        const my = (edge.y1 + NODE_H/2 + edge.y2 - NODE_H/2) / 2;
        const label = edge.isDit ? '·' : '—';
        html += `<text class="trace-label" x="${mx + (edge.isDit ? -6 : 6)}" y="${my}">${label}</text>`;
      }
      // Draw nodes
      for (const node of nodes) {
        const cls = node.isEmpty ? 'empty' : '';
        html += `<rect class="node-box ${cls}" data-code="${node.code}"
          x="${node.x - NODE_W/2}" y="${node.y - NODE_H/2}"
          width="${NODE_W}" height="${NODE_H}" rx="4" />`;
        if (node.char) {
          html += `<text class="node-letter ${cls}" data-code="${node.code}"
            x="${node.x}" y="${node.y}">${node.char}</text>`;
        }
        if (node.code && !node.isEmpty) {
          const codeStr = node.code.replace(/\./g, '·').replace(/-/g, '—');
          html += `<text class="node-code" x="${node.x}" y="${node.y + NODE_H/2 + 9}">${codeStr}</text>`;
        }
      }
      svg.innerHTML = html;
    }
    renderTree();

    // Audio
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }

    function playTone(durationMs) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 650;
      gain.gain.value = 0.3;
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.3, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + durationMs / 1000);
      osc.start(now);
      osc.stop(now + durationMs / 1000 + 0.01);
    }

    function playDit() { playTone(80); }
    function playDah() { playTone(240); }

    function playMorseSequence(code, callback) {
      initAudio();
      let delay = 0;
      const ditMs = 80, dahMs = 240, gap = 120;
      for (let i = 0; i < code.length; i++) {
        const dur = code[i] === '.' ? ditMs : dahMs;
        setTimeout(() => playTone(dur), delay);
        delay += dur + gap;
      }
      if (callback) setTimeout(callback, delay + 300);
    }

    // State
    let currentCode = '';
    let decodedText = '';
    let commitTimer = null;
    let mode = 'explore';
    let targetLetter = '';
    let score = { correct: 0, total: 0 };
    let pressStart = 0;
    let isPressed = false;
    let toneOsc = null;
    let toneGain = null;

    const codeDisplay = document.getElementById('codeDisplay');
    const decodedDisplay = document.getElementById('decodedDisplay');
    const touchKey = document.getElementById('touchKey');

    // Highlight current path in tree
    function highlightPath(code, className = 'active') {
      // Clear all highlights
      svg.querySelectorAll('.node-box').forEach(el => {
        el.classList.remove('active', 'correct', 'target');
      });
      svg.querySelectorAll('.node-letter').forEach(el => {
        el.classList.remove('active');
      });
      svg.querySelectorAll('.trace-line').forEach(el => {
        el.classList.remove('active');
      });

      if (!code && code !== '') return;

      // Highlight current node
      const nodeBox = svg.querySelector(`.node-box[data-code="${code}"]`);
      const nodeLetter = svg.querySelector(`.node-letter[data-code="${code}"]`);
      if (nodeBox) nodeBox.classList.add(className);
      if (nodeLetter) nodeLetter.classList.add(className === 'active' ? 'active' : '');

      // Highlight path edges
      if (className === 'active') {
        for (let i = 1; i <= code.length; i++) {
          const partial = code.substring(0, i);
          const traceLine = svg.querySelector(`.trace-line[data-code="${partial}"]`);
          if (traceLine) traceLine.classList.add('active');
        }
      }
    }

    function highlightTarget(letter) {
      const code = REVERSE_MAP[letter];
      if (!code) return;
      const nodeBox = svg.querySelector(`.node-box[data-code="${code}"]`);
      if (nodeBox) nodeBox.classList.add('target');
    }

    // Input handling
    function addSymbol(symbol) {
      initAudio();
      if (symbol === '.') playDit();
      else playDah();

      currentCode += symbol;
      updateDisplay();
      highlightPath(currentCode);

      clearTimeout(commitTimer);
      commitTimer = setTimeout(commitLetter, 800);
    }

    function commitLetter() {
      if (!currentCode) return;
      const letter = MORSE_MAP[currentCode];

      if (mode === 'explore') {
        if (letter && ENGLISH_LETTERS.includes(letter)) {
          decodedText += letter;
          highlightPath(currentCode, 'correct');
        } else {
          decodedText += '?';
        }
        setTimeout(() => {
          currentCode = '';
          highlightPath('');
          updateDisplay();
        }, 500);
      } else if (mode === 'encode') {
        if (letter === targetLetter) {
          score.correct++;
          highlightPath(currentCode, 'correct');
          setTimeout(() => {
            currentCode = '';
            highlightPath('');
            nextChallenge();
          }, 600);
        } else {
          highlightPath(currentCode, 'active');
          setTimeout(() => {
            currentCode = '';
            highlightPath('');
            highlightTarget(targetLetter);
            updateDisplay();
          }, 400);
        }
        score.total++;
      } else if (mode === 'decode') {
        if (letter === targetLetter) {
          score.correct++;
          decodedText = letter + ' ✓';
          highlightPath(currentCode, 'correct');
        } else {
          decodedText = (letter || '?') + ' ✗  (was ' + targetLetter + ')';
          highlightPath(currentCode, 'active');
        }
        score.total++;
        setTimeout(() => {
          currentCode = '';
          highlightPath('');
          nextChallenge();
        }, 800);
      }
      updateDisplay();
    }

    function updateDisplay() {
      const displayCode = currentCode.replace(/\./g, '·').replace(/-/g, '—');
      codeDisplay.textContent = displayCode || ' ';

      if (mode === 'explore') {
        decodedDisplay.textContent = decodedText || 'TAP THE KEY TO BEGIN';
      } else if (mode === 'encode') {
        decodedDisplay.textContent = targetLetter
          ? `TYPE: ${targetLetter}    ${score.correct}/${score.total}`
          : `SCORE: ${score.correct}/${score.total}`;
      } else if (mode === 'decode') {
        decodedDisplay.textContent = decodedText
          || `LISTEN AND DECODE    ${score.correct}/${score.total}`;
      }
    }

    function nextChallenge() {
      const letters = ENGLISH_LETTERS;
      targetLetter = letters[Math.floor(Math.random() * letters.length)];
      currentCode = '';
      decodedText = '';

      if (mode === 'encode') {
        highlightTarget(targetLetter);
      } else if (mode === 'decode') {
        const code = REVERSE_MAP[targetLetter];
        playMorseSequence(code);
      }
      updateDisplay();
    }

    // Touch/mouse key handling
    function startPress(e) {
      e.preventDefault();
      if (isPressed) return;
      initAudio();
      isPressed = true;
      pressStart = Date.now();
      touchKey.classList.add('pressed');

      // Start continuous tone
      toneOsc = audioCtx.createOscillator();
      toneGain = audioCtx.createGain();
      toneOsc.type = 'sine';
      toneOsc.frequency.value = 650;
      toneGain.gain.value = 0.3;
      toneOsc.connect(toneGain);
      toneGain.connect(audioCtx.destination);
      toneOsc.start();
    }

    function endPress(e) {
      e.preventDefault();
      if (!isPressed) return;
      isPressed = false;
      touchKey.classList.remove('pressed');

      // Stop tone
      if (toneOsc) {
        toneGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.02);
        toneOsc.stop(audioCtx.currentTime + 0.03);
        toneOsc = null;
        toneGain = null;
      }

      const duration = Date.now() - pressStart;
      const symbol = duration < 180 ? '.' : '-';
      currentCode += symbol;
      updateDisplay();
      highlightPath(currentCode);

      clearTimeout(commitTimer);
      commitTimer = setTimeout(commitLetter, 800);
    }

    // Event listeners
    touchKey.addEventListener('mousedown', startPress);
    touchKey.addEventListener('mouseup', endPress);
    touchKey.addEventListener('mouseleave', (e) => { if (isPressed) endPress(e); });
    touchKey.addEventListener('touchstart', startPress, { passive: false });
    touchKey.addEventListener('touchend', endPress, { passive: false });
    touchKey.addEventListener('touchcancel', endPress, { passive: false });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.repeat) return;
      if (e.code === 'Space') {
        e.preventDefault();
        startPress(e);
      } else if (e.key === '.') {
        e.preventDefault();
        addSymbol('.');
      } else if (e.key === '-') {
        e.preventDefault();
        addSymbol('-');
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        currentCode = '';
        decodedText = '';
        clearTimeout(commitTimer);
        highlightPath('');
        if (mode === 'encode' && targetLetter) highlightTarget(targetLetter);
        updateDisplay();
      }
    });
    document.addEventListener('keyup', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        endPress(e);
      }
    });

    // Click on tree nodes
    svg.addEventListener('click', (e) => {
      const target = e.target.closest('[data-code]');
      if (!target) return;
      const code = target.dataset.code;
      const letter = MORSE_MAP[code];
      if (letter && ENGLISH_LETTERS.includes(letter)) {
        initAudio();
        playMorseSequence(code);
        highlightPath(code, 'correct');
        codeDisplay.textContent = code.replace(/\./g, '·').replace(/-/g, '—');
        setTimeout(() => highlightPath(currentCode || ''), 1200);
      }
    });

    // Mode switching
    document.querySelectorAll('.mode-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        mode = btn.dataset.mode;
        currentCode = '';
        decodedText = '';
        targetLetter = '';
        score = { correct: 0, total: 0 };
        clearTimeout(commitTimer);
        highlightPath('');
        if (mode === 'encode' || mode === 'decode') {
          nextChallenge();
        }
        updateDisplay();
      });
    });

    // Replay button for decode mode
    svg.addEventListener('dblclick', () => {
      if (mode === 'decode' && targetLetter) {
        playMorseSequence(REVERSE_MAP[targetLetter]);
      }
    });

    // Init
    updateDisplay();

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
